[platformio]
default_envs = ATmega8

[env]
platform      = atmelavr
board_build.f_cpu = 8000000L

; Firmware uses PB7 as a plain GPIO input (TH) and leaves PB6 unused; both
; pins double as XTAL1/XTAL2 under an external-crystal fuse configuration.
; MiniCore's fuse calculator defaults to "external" oscillator, which would
; reserve PB6/PB7 for a crystal and break the TH input, so the internal RC
; oscillator must be selected explicitly to match the code/README.
board_hardware.oscillator = internal

build_flags =
    -std=gnu99
    -Os
    -Wall
    -Wextra
    -ffunction-sections
    -fdata-sections

build_unflags =
    -std=gnu11

upload_protocol = arduino

monitor_speed = 115200

; MCU identification macros (__AVR_ATmegaXX__) are provided by the toolchain
; from each `board` setting, so they are NOT redefined here. Each env simply
; inherits the common [env] build_flags.

; ==================================================
; ATmega8
; ==================================================
[env:ATmega8]
board = ATmega8

; ==================================================
; ATmega48 / 48A
; ==================================================
[env:ATmega48]
board = ATmega48

; ==================================================
; ATmega88 / 88A
; ==================================================
[env:ATmega88]
board = ATmega88

; ==================================================
; ATmega168 / 168A
; ==================================================
[env:ATmega168]
board = ATmega168

; ==================================================
; ATmega328
; ==================================================
[env:ATmega328]
board = ATmega328
