[platformio]
default_envs = ATmega8

[env]
platform      = atmelavr
board_build.f_cpu = 8000000L

build_flags =
    -std=gnu99
    -Os
    -Wall
    -Wextra
    -ffunction-sections
    -fdata-sections

build_unflags =
    -std=gnu11

upload_protocol = arduino

monitor_speed = 115200

; MCU identification macros (__AVR_ATmegaXX__) are provided by the toolchain
; from each `board` setting, so they are NOT redefined here. Each env simply
; inherits the common [env] build_flags.

; ==================================================
; ATmega8
; ==================================================
[env:ATmega8]
board = ATmega8

; ==================================================
; ATmega88 / 88A
; ==================================================
[env:ATmega88]
board = ATmega88

; ==================================================
; ATmega88P / 88PA
; ==================================================
[env:ATmega88P]
board = ATmega88P
